name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  shipyard-qa:
    name: Shipyard Column Shift QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Download live atlas GeoJSON
        run: |
          curl -sSfL "https://arctictradelanes.com/atlas.4326.geojson" -o atlas.4326.geojson
        
      - name: Run shipyard column-shift check
        run: node scripts/check-shipyard-column-shift.mjs