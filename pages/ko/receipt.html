<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!--ATL-SEO-->
<style>
:root{color-scheme:dark;--bg:#071018;--bg2:#0f2740;--ink:#e8eef4;--mut:#9fb3c8;--line:rgba(120,170,220,.22);--acc:#64b5f6;--ok:#81c784;--warn:#ffb74d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans',sans-serif;background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 45%,var(--bg) 100%);color:var(--ink);min-height:100vh;line-height:1.6}
a{color:var(--acc)}
.wrap{max-width:820px;margin:0 auto;padding:28px 20px 64px}
header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:28px}
.brand{font-weight:700;font-size:1.05rem;letter-spacing:.2px;color:var(--ink);text-decoration:none}
nav{display:flex;gap:16px;font-size:.9rem;flex-wrap:wrap}
h1{font-size:clamp(1.6rem,4vw,2.2rem);line-height:1.25;margin-bottom:12px;background:linear-gradient(90deg,#64b5f6,#81c784);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lede{color:var(--mut);max-width:66ch;margin-bottom:26px}
.card{background:rgba(12,28,44,.72);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:22px}
.card h2{font-size:1.05rem;margin-bottom:14px;color:var(--ink)}
dl.rows{display:grid;grid-template-columns:max-content 1fr;gap:10px 18px;font-size:.95rem}
dl.rows dt{color:var(--mut)}dl.rows dd{font-weight:600;unicode-bidi:plaintext}
.local{color:var(--mut);font-size:.9rem;margin-top:12px}
.warn{margin-top:12px;padding:12px 14px;border-left:3px solid var(--warn);background:rgba(255,183,77,.08);border-radius:8px;font-size:.88rem;color:#ffe0b2}
.payto{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;word-break:break-all;color:var(--ink)}
.cta{display:inline-block;margin-top:16px;background:linear-gradient(90deg,#1e88e5,#43a047);color:#fff;text-decoration:none;font-weight:650;padding:12px 20px;border-radius:10px}
.meta{display:flex;flex-wrap:wrap;gap:18px;margin-top:14px;font-size:.85rem;color:var(--mut)}
.meta>span{display:inline-flex;gap:.4em;align-items:baseline}
.meta bdi{unicode-bidi:isolate}
ol.steps{list-style:none;counter-reset:s}
ol.steps li{padding:16px 0;border-top:1px solid var(--line)}
ol.steps li:first-child{border-top:0;padding-top:0}
ol.steps h3{font-size:.98rem;margin-bottom:6px}
ol.steps p{color:var(--mut);font-size:.92rem}
pre{background:#040b12;border:1px solid var(--line);border-radius:10px;padding:14px;overflow-x:auto;font-size:.82rem;margin-top:12px;direction:ltr;text-align:left}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.hint{color:var(--mut);font-size:.85rem;margin-top:8px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:13px 22px;font-weight:650;color:#04121c;background:linear-gradient(90deg,#81c784,#64b5f6)}
button[disabled]{opacity:.6;cursor:progress}
#receipt{margin-top:18px}
#receipt .rline{font-size:.92rem;padding:6px 0;border-bottom:1px dashed var(--line);direction:inherit}
#receipt .rline:last-of-type{border-bottom:0}
#r-err{color:#ff8a80;font-size:.9rem;margin-top:12px}
.foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);color:var(--mut);font-size:.82rem;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/ko">ArcticTradeLanes.com</a>
    <nav>
      <a href="/ko/x402/pay">x402</a>
      <a href="/ko/collaborate">협업</a>
      <a href="/ko/pricing">요금</a>
    </nav>
  </header>

  <main>
    <h1>영수증</h1>
    <p class="lede">잠금 해제를 누르세요. 항로 인텔리전스 페이로드가 공개되고, 금액, 네트워크, payTo 주소, 트랜잭션 해시가 포함된 영수증이 여기에 표시됩니다.</p>

    <section class="card">
      <div id="r-lines" dir="auto"></div>
      <button id="copy" type="button" style="margin-top:16px">영수증을 JSON으로 복사</button>
      <noscript><p class="hint"><a href="/ko/x402/pay">페이로드 잠금 해제</a></p></noscript>
    </section>

    <p class="warn">$ATL 토큰은 아직 발행되지 않았습니다. 구매할 컨트랙트 주소도, 토큰 판매도 없습니다. 오늘의 결제는 Base의 5.00 USDC입니다.</p>
    <p><a href="/ko">실시간 지도로 돌아가기</a></p>
  </main>

  <footer class="foot">
    <span>ArcticTradeLanes.com · x402 결제 · Base의 5.00 USDC</span>
    <span>Base · USDC · x402</span>
  </footer>
</div>
<script>
(function () {
  var ok = /[?&]tx=0x[0-9a-fA-F]{16,}/.test(window.location.search);
  if (!ok) window.location.replace("/ko/x402/pay");
})();
</script>

</body>
</html>
